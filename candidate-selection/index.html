<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品候補選択</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#202124;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:0 12px 32px}header{max-width:720px;margin:0 auto;padding:18px 2px 8px}h1{font-size:1.45rem;margin:0 0 8px}.sub{color:#5f6368;font-size:.9rem;margin:0}.notice{background:#fff7df;border:1px solid #e3c66b;border-radius:14px;padding:14px;margin:12px 0;line-height:1.65;font-size:.91rem}.notice strong{color:#684b00}.meta{max-width:720px;margin:14px auto;color:#5f6368;font-size:.9rem}.list{max-width:720px;margin:0 auto}.card{background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #1f29370d}.card h2{font-size:1.12rem;line-height:1.45;margin:0 0 10px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:700;background:#fff0d5;color:#805600}.badge.ok{background:#dff5e4;color:#17652d}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0;font-size:.9rem}.fact{min-width:0}.label{display:block;color:#6b7280;font-size:.76rem;margin-bottom:2px}.value{overflow-wrap:anywhere;line-height:1.45}.features,.notes{font-size:.9rem;line-height:1.6;margin:11px 0}.notes{background:#faf4e9;border-radius:10px;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{appearance:none;border:0;border-radius:10px;min-height:46px;padding:10px 12px;font:inherit;font-weight:700;text-align:center;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn-page{background:#eef1f5;color:#202124}.btn-select{background:#202124;color:#fff}.btn-select:disabled{background:#8d939a;cursor:default}.pending{display:none;background:#e8eefc;border:1px solid #9eb4e8;border-radius:11px;padding:11px;margin-top:12px;font-size:.88rem;line-height:1.55}.pending.show{display:block}.pending strong{display:block;color:#244a99;margin-bottom:3px}.empty{padding:24px;background:#fff;border-radius:12px}.footer-note{max-width:720px;margin:20px auto 0;color:#6b7280;font-size:.78rem;line-height:1.55}@media(max-width:560px){body{padding-left:10px;padding-right:10px}.facts{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.btn{min-height:50px;font-size:.98rem}}
</style>
</head>
<body>
<header><h1>商品候補選択</h1><p class="sub">確認 → 採用候補 → 人間確認待ち</p><div class="notice"><strong>このページで採用は確定しません。</strong><br>「採用候補にする」を押すと、状態は <b>SELECTED_PENDING_HUMAN_REVIEW</b> で停止します。楽天アフィリエイトリンク確認、画像確認、人間承認が完了するまで、IMAGE_OKへの変更・動画生成・投稿は行いません。</div></header>
<p id="meta" class="meta">候補データを読み込み中…</p><main id="list" class="list"></main><p class="footer-note">公開情報だけで確認できない内容は「人間確認待ち」と表示します。アフィリエイトリンクは人間確認後に入力してください。自動投稿、API接続、OAuth接続は行いません。</p>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const price=c=>c.price&&c.price.value!=null?`${Number(c.price.value).toLocaleString()}円（公開ページ表示）`:'未確認';
function makePending(c,button,panel){const record={status:'SELECTED_PENDING_HUMAN_REVIEW',candidate_id:c.id,product_name:c.product_name,product_url:c.product_url,affiliate_link:c.affiliate_link||'',next_steps:['楽天アフィリエイトリンク確認','画像確認','人間承認','IMAGE_OK','動画生成'],auto_adoption:false,auto_posting:false};try{localStorage.setItem('selected_candidate_pending',JSON.stringify(record))}catch(e){}const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='selected_candidate_pending_human_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);button.disabled=true;button.textContent='人間確認待ち';panel.classList.add('show');panel.innerHTML='<strong>SELECTED_PENDING_HUMAN_REVIEW</strong>採用は確定していません。楽天リンク確認・画像確認・人間承認が完了するまで停止します。'}
fetch('candidate_records.json').then(r=>{if(!r.ok)throw new Error('load failed');return r.json()}).then(data=>{document.getElementById('meta').textContent=`候補 ${data.candidates.length}件｜公開情報のみ｜自動採用なし`;const root=document.getElementById('list');root.innerHTML=data.candidates.map((c,i)=>`<article class="card"><h2>${i+1}. ${esc(c.product_name)}</h2><div class="badges"><span class="badge ${c.image_eligibility_status==='IMAGE_OK'?'ok':''}">${esc(c.image_eligibility_status)}</span><span class="badge">${esc(c.affiliate_link_status)}</span></div><div class="facts"><div class="fact"><span class="label">価格</span><span class="value">${price(c)}</span></div><div class="fact"><span class="label">ショップ</span><span class="value">${esc(c.shop_name)}</span></div><div class="fact"><span class="label">商品URL</span><span class="value"><a href="${esc(c.product_url)}" target="_blank" rel="noopener">商品ページを見る</a></span></div><div class="fact"><span class="label">画像枚数</span><span class="value">${esc(c.image_count_public_page)}枚（アフィリエイト画面未確認）</span></div><div class="fact"><span class="label">人物・モデル</span><span class="value">${esc(c.model_presence_status)}</span></div><div class="fact"><span class="label">同一商品判定</span><span class="value">${esc(c.same_product_status)}</span></div><div class="fact"><span class="label">画像内テキスト</span><span class="value">${esc(c.source_text_status)}</span></div><div class="fact"><span class="label">アフィリエイトリンク</span><span class="value">${c.affiliate_link?esc(c.affiliate_link):'人間確認後に入力'}</span></div></div><p class="features"><strong>特徴：</strong>${esc(c.features.join('／'))}</p><p class="notes"><strong>注意事項：</strong>${esc(c.notes)}</p><div class="actions"><a class="btn btn-page" href="${esc(c.product_url)}" target="_blank" rel="noopener">商品ページを見る</a><button class="btn btn-select" type="button" data-id="${esc(c.id)}">採用候補にする</button></div><div class="pending" id="pending-${esc(c.id)}"></div></article>`).join('');root.querySelectorAll('.btn-select').forEach(button=>{button.addEventListener('click',()=>{const c=data.candidates.find(x=>x.id===button.dataset.id);makePending(c,button,document.getElementById('pending-'+c.id))})})}).catch(()=>{document.getElementById('meta').textContent='';document.getElementById('list').innerHTML='<p class="empty">候補データを読み込めませんでした。</p>'});
</script>
</body></html>
